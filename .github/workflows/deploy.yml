name: Deploy

on:
  push:
    branches:
      - main

# Allow the workflow's GITHUB_TOKEN to push the gh-pages branch.
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install dependencies
        # Uses `npm install` (not `npm ci`) because no package-lock.json is
        # committed yet. After you run `npm install` locally and commit the
        # generated package-lock.json, this can be switched back to `npm ci`.
        run: npm install

      - name: Build project
        run: npm run build --if-present

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
